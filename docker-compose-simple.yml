services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: es_history
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - history_net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_history
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - history_net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis_history
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - history_net
    restart: unless-stopped

networks:
  history_net:
    driver: bridge

volumes:
  es_data:
  qdrant_data:
  redis_data:
